<!-- Instant loader: painted in the very first frame, before any JS/CSS file arrives -->
<style>
  html,body{margin:0;background:#000;color:#ecebe6}
  #loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#000;transition:opacity .9s cubic-bezier(.2,.7,.1,1),visibility .9s}
  #loader .ring{width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.12);border-top-color:#ffb46b;animation:spin 1.1s linear infinite}
  #loader .pct{margin-top:18px;font:500 11px/1 system-ui,sans-serif;letter-spacing:.32em;color:#8d8b86;text-align:center}
  .loaded #loader{opacity:0;visibility:hidden}
  @keyframes spin{to{transform:rotate(1turn)}}
  @media (prefers-reduced-motion:reduce){#loader .ring{animation-duration:4s}}
</style>
<link rel="stylesheet" href="css/style.css">
<script type="application/ld+json" id="ld">{"@context":"https://schema.org","@type":"Person","name":"Your Name","jobTitle":"Creative Developer","url":"https://example.com"}</script>
</head>
<body>
<div id="loader" role="status" aria-live="polite"><div><div class="ring"></div><div class="pct"><span id="pct">0</span>%</div></div></div>

<canvas id="scene" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<div id="cursor" aria-hidden="true"><span></span></div>
<div class="progress" aria-hidden="true"><span></span></div>

<header class="topbar">
  <a class="brand" href="#top" data-name>Your Name</a>
  <dl class="hud" id="hud"></dl>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <button class="menu" id="menuBtn" aria-label="Menu" aria-expanded="false"><span></span><span></span></button>
</header>

<main id="top">
  <section class="hero" id="hero">
    <p class="kicker reveal" id="heroKicker"></p>
    <h1 class="display" id="heroTitle"></h1>
    <p class="lede reveal" id="heroTagline"></p>
    <a class="cue" href="#about"><i></i><span id="heroCue">Scroll</span></a>
  </section>
  <div id="sections"></div>
</main>

<footer class="footer">
  <p><span data-name>Your Name</span> · © <span id="year"></span></p>
  <a href="#top" class="totop">Back to top ↑</a>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><style>#loader{display:none}.reveal{opacity:1!important;transform:none!important}</style></noscript>

<script src="config.js"></script>
<script src="js/engine.js"></script>
<script src="js/main.js"></script>
</body>
