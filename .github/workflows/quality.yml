# Runs the automated quality gate on every push / pull request.
name: Quality gate
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check.py site
      - run: python scripts/build-master-prompt.py --check
